name: Release

# Publishes a release when a tag is pushed: git tag -a v0.3.0 -m "diskdoctor 0.3.0" && git push origin v0.3.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build and publish (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Tests
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "diskdoctor-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/diskdoctor.exe, README.md, CHANGELOG.md $name
          if (Test-Path LICENSE) { Copy-Item LICENSE $name }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          Get-Content "$name.zip.sha256"

      - name: Publish to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "diskdoctor-${{ github.ref_name }}-windows-x64"
          $notes = @"
          Download ``$name.zip``, extract it and double-click ``diskdoctor.exe``.
          To read SMART data, also install smartmontools: ``winget install smartmontools.smartmontools``.
          English by default; switch to Brazilian Portuguese with menu item 0 or ``diskdoctor language pt-BR``.

          What's new: see the [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
          "@
          gh release create "${{ github.ref_name }}" "$name.zip" "$name.zip.sha256" --title "diskdoctor ${{ github.ref_name }}" --notes $notes
