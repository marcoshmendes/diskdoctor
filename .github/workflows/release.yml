name: Release

# Publica uma versão ao enviar uma tag: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Compilar e publicar (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust estável
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Testes
        run: cargo test --locked

      - name: Compilar (release)
        run: cargo build --release --locked

      - name: Empacotar
        shell: pwsh
        run: |
          $name = "diskdoctor-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/diskdoctor.exe, README.md, CHANGELOG.md $name
          if (Test-Path LICENSE) { Copy-Item LICENSE $name }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          Get-Content "$name.zip.sha256"

      - name: Publicar no GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "diskdoctor-${{ github.ref_name }}-windows-x64"
          $notes = @"
          Baixe ``$name.zip``, extraia e dê dois cliques em ``diskdoctor.exe``.
          Para ler o SMART, instale também o smartmontools: ``winget install smartmontools.smartmontools``.

          Novidades: veja o [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
          "@
          gh release create "${{ github.ref_name }}" "$name.zip" "$name.zip.sha256" --title "diskdoctor ${{ github.ref_name }}" --notes $notes
