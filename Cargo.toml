[package]
name = "diskdoctor"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Non-destructive diagnostics for HDDs, SSDs, USB flash drives and memory cards on Windows"
readme = "README.md"
license = "MIT"
repository = "https://github.com/marcoshmendes/diskdoctor"

[lib]
name = "diskdoctor"
path = "src/lib.rs"

[[bin]]
name = "diskdoctor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
comfy-table = "8.0.1"
console = "0.16.6"
ctrlc = { version = "3.5.2", features = ["termination"] }
dialoguer = { version = "0.12", default-features = false }
indicatif = "0.18.6"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Win32 bindings exist only on Windows; everything else (parsers, the analysis
# engine, test engines with simulated readers) builds and is testable on any OS.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
# Do NOT use `strip = true`: with Windows 11 Smart App Control enabled, the stripped
# binary was blocked (CodeIntegrity 3077) while the same build without strip runs.
strip = false
